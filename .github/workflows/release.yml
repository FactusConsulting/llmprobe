name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  APP_NAME: llmprobe
  PROJECT_PATH: src/llmprobe/llmprobe.csproj

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: arc-runner-public
          - target: linux-arm64
            runner: arc-runner-public
          # No osx-x64 or osx-arm64. They were cross-compiled here on Linux for
          # a while -- PublishSingleFile without AOT bundles the osx runtime
          # pack NuGet fetches, so nothing had to execute on a Mac -- but a
          # target nobody here runs still has to be released, checksummed and
          # carried in the tap formula. macOS support is dropped rather than
          # shipped untested: every machine that consumes these binaries runs
          # Linux or Windows.
          #
          # Restoring it is this block plus the osx branch of the Homebrew
          # formula below. Do not restore `runner: macos-latest` with it: macOS is
          # the one runner GitHub bills at full price and cannot be
          # self-hosted, and it cost 25.85 USD across these three repos.
          #
          # Likewise no win-x64: all CI runs on the self-hosted Linux runners
          # and no Windows runner is used, so the Windows zip and the
          # Chocolatey package are no longer built or published.
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Derive version (tag drives version, otherwise dev+sha)
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building with version: $v"

      - name: Test (unit only, skip integration)
        if: matrix.target == 'linux-x64'
        run: dotnet test tests/${{ env.APP_NAME }}.Tests/${{ env.APP_NAME }}.Tests.csproj -c Release --filter "Category!=Integration" --logger "console;verbosity=normal"
        shell: bash

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} -r ${{ matrix.target }}

      - name: Publish (single-file, self-contained)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -r ${{ matrix.target }} \
            --self-contained \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:InformationalVersion=${{ steps.ver.outputs.version }} \
            -p:PublishSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o publish/${{ matrix.target }}
        shell: bash

      - name: Package (tar.gz)
        run: |
          cd publish/${{ matrix.target }}
          tar -czf ../../${{ env.APP_NAME }}-${{ matrix.target }}.tar.gz ${{ env.APP_NAME }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.target }}.tar.gz
          if-no-files-found: ignore
          # These exist only to hand the binary from the matrix job to the
          # release job a few minutes later; the release itself keeps the real
          # copy, permanently and for free. The org default is 7 days, which
          # billed ~800 MB per repo per release -- GigabyteHours accrue for as
          # long as a file exists, so the cost is the retention, not the upload.
          # One day is the floor GitHub allows.
          retention-days: 1

  release:
    name: Release
    needs: build
    runs-on: arc-runner-public
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    outputs:
      # Resolved once from the tag and consumed by the downstream
      # homebrew job. is_prerelease gates the finals-only Homebrew bump so an RC
      # tag (vX.Y.Z-rc.N) never moves the single-version tap formula.
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: resolve
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Prerelease (RC) detection: a SemVer release-candidate tag carries a
          # literal `-rc.` segment (e.g. v0.2.0-rc.1). A plain vX.Y.Z is final.
          case "$TAG" in
            *-rc.*) IS_PRERELEASE=true ;;
            *)      IS_PRERELEASE=false ;;
          esac
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> is_prerelease=$IS_PRERELEASE"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz

  homebrew:
    name: Bump Homebrew tap
    needs: release
    runs-on: arc-runner-public
    # Skip on prerelease: Homebrew has no prerelease channel (the tap formula is a
    # single "latest" version), so RCs are finals-only here.
    if: needs.release.outputs.is_prerelease != 'true'
    steps:
      - name: Bump factusconsulting/homebrew-tap formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -e
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set - skipping Homebrew tap bump."
            exit 0
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sha() {
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "$base/llmprobe-$1.tar.gz" | sha256sum | cut -d' ' -f1
          }
          linux_arm64=$(sha linux-arm64)
          linux_x64=$(sha linux-x64)
          echo "linux-arm64: $linux_arm64"
          echo "linux-x64:   $linux_x64"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/FactusConsulting/homebrew-tap.git" tap
          f=tap/Formula/llmprobe.rb
          cat > "$f" <<EOF
          class Llmprobe < Formula
            desc "Agent-friendly CLI for probing OpenAI-compatible LLM endpoints"
            homepage "https://github.com/FactusConsulting/llmprobe"
            version "${VERSION}"
            license "MIT"

            # Linux only. The tap is still the right place for this formula
            # -- Homebrew runs on Linux -- but the release carries no macOS
            # binary to point at, so there is no on_macos block. `brew install`
            # on a Mac fails with "not available", which is the truth.
            on_linux do
              on_arm do
                url "${base}/llmprobe-linux-arm64.tar.gz"
                sha256 "${linux_arm64}"
              end
              on_intel do
                url "${base}/llmprobe-linux-x64.tar.gz"
                sha256 "${linux_x64}"
              end
            end

            def install
              bin.install "llmprobe"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/llmprobe --version")
              assert_match "guidance for AI agents", shell_output("#{bin}/llmprobe --help-ai")
            end
          end
          EOF
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/llmprobe.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}."
            exit 0
          fi
          git -C tap commit -m "llmprobe ${VERSION}"
          git -C tap push origin HEAD
